<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Color de la barra de estado en móviles (Theme Color VIP) -->
    <meta name="theme-color" content="#003B4A" />
    
    <!-- SEO Básico -->
    <title>DentalConnect | Encuentra tu consultorio ideal</title>
    <meta name="description" content="Accede a la red dental más exclusiva. Encuentra clínicas verificadas, agenda citas en segundos y gestiona tu salud bucal de forma segura." />
    
    <!-- Open Graph (Para que se vea bien al compartir por WhatsApp/Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DentalConnect | Tu sonrisa en las mejores manos" />
    <meta property="og:description" content="Encuentra el consultorio dental ideal para ti. Agenda citas con especialistas verificados." />
    <!-- Cambia esta URL por la de una imagen real de tu proyecto -->
    <meta property="og:image" content="https://images.unsplash.com/photo-1606811971618-4486d14f3f99?auto=format&fit=crop&w=1200&q=80" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Favicon (Pon aquí tu logo en formato .ico o .png pequeño) -->
    <link rel="icon" type="image/png" href="./src/img/logodental.png" />

    <!-- Preconexión a Google Fonts para acelerar la carga -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>
      /* =========================================
         SPLASH SCREEN (Pantalla de carga VIP)
         Se muestra mientras React se monta.
         ========================================= */
      body {
        margin: 0;
        background-color: #F4F8FA; /* Fondo perla de tu diseño */
        font-family: system-ui, -apple-system, sans-serif;
      }

      .splash-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #F4F8FA;
        z-index: 9999;
      }

      .splash-logo {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 2.5rem;
        font-weight: 900;
        color: #003B4A;
        letter-spacing: -1px;
        margin-bottom: 2rem;
        animation: pulseLogo 2s ease-in-out infinite;
      }

      .splash-logo span {
        color: #00D2D3;
      }

      .splash-loader {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(0, 210, 211, 0.2);
        border-top-color: #00D2D3;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes pulseLogo {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }
    </style>
  </head>
  <body>
    <!-- Splash screen que desaparecerá cuando React tome el control -->
    <div id="root">
      <div class="splash-screen">
        <div class="splash-logo">Dental<span>Connect</span></div>
        <div class="splash-loader"></div>
      </div>
    </div>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
