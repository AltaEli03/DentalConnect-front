name: Frontend CI

on:
  pull_request: {}
    # Run the same verification before every merge, including feature -> develop
    # and develop -> release promotions.
  push:
    branches: [main, develop, release]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:contrast
      - run: npm run build
