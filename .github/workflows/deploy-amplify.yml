name: Deploy frontend to Amplify
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Validate Amplify configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AMPLIFY_APP_ID" || { echo "Missing AMPLIFY_APP_ID repository variable" >&2; exit 1; }
          test -n "$AWS_ROLE_ARN" || { echo "Missing AWS_ROLE_ARN repository variable" >&2; exit 1; }
          test -n "$VITE_API_BASE_URL" || { echo "Missing VITE_API_BASE_URL repository variable" >&2; exit 1; }
          [[ "$VITE_API_BASE_URL" == https://* ]] || { echo "VITE_API_BASE_URL must use HTTPS in production" >&2; exit 1; }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: npm ci && npm run build
      - run: |
          cd dist
          zip -r ../site.zip .
          cd ..
          DEPLOYMENT=$(aws amplify create-deployment --app-id "$AMPLIFY_APP_ID" --branch-name main)
          JOB=$(echo "$DEPLOYMENT" | jq -r .jobId)
          URL=$(echo "$DEPLOYMENT" | jq -r .zipUploadUrl)
          curl --fail --request PUT --upload-file site.zip "$URL"
          aws amplify start-deployment --app-id "$AMPLIFY_APP_ID" --branch-name main --job-id "$JOB"
          for attempt in $(seq 1 60); do
            STATUS=$(aws amplify get-job --app-id "$AMPLIFY_APP_ID" --branch-name main --job-id "$JOB" --query 'job.summary.status' --output text)
            case "$STATUS" in
              SUCCEED) echo "Amplify job $JOB succeeded"; exit 0 ;;
              FAILED|CANCELLED) echo "Amplify job $JOB ended with $STATUS" >&2; exit 1 ;;
              *) sleep 10 ;;
            esac
          done
          echo "Timed out waiting for Amplify job $JOB" >&2
          exit 1
